name: Semgrep CE Analysis

on:
  push:
    branches:
      - main
      - experiment-vulnerable
      - experiment-fixed
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Python Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Record scanned commit
        run: |
          git rev-parse HEAD > scanned-commit.txt
          echo "Scanned commit: $(cat scanned-commit.txt)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: |
          python -m pip install semgrep
          semgrep --version > semgrep-version.txt
          cat semgrep-version.txt

      - name: Record scan start time
        run: echo "START_TIME=$(date +%s)" >> "$GITHUB_ENV"

      - name: Run Semgrep CE
        run: |
          semgrep scan \
            --config "p/python" \
            --sarif \
            --output semgrep.sarif \
            --metrics=off \
            .

      - name: Record scan duration
        if: always()
        run: |
          if [ -n "${START_TIME:-}" ]; then
            END_TIME=$(date +%s)
            DURATION=$((END_TIME - START_TIME))
            echo "Semgrep CE scan elapsed time: $DURATION seconds" \
              | tee duration.txt
          fi

      - name: Upload analysis artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-ce-results-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            semgrep.sarif
            scanned-commit.txt
            semgrep-version.txt
            duration.txt
          if-no-files-found: error