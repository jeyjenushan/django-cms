name: Semgrep AppSec Analysis

on:
  push:
    branches:
      - experiment-vulnerable-defect-before-fixed
      - experiment-fixed-defect
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Python Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record scanned commit
        run: |
          git rev-parse HEAD > scanned-commit.txt
          echo "Scanned commit: $(cat scanned-commit.txt)"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: |
          python -m pip install semgrep
          semgrep --version > semgrep-version.txt
          cat semgrep-version.txt
      - name: Check Semgrep token
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          if [ -z "$SEMGREP_APP_TOKEN" ]; then
            echo "Missing SEMGREP_APP_TOKEN repository secret."
            exit 1
          fi
      - name: Record scan start time
        run: echo "START_TIME=$(date +%s)" >> "$GITHUB_ENV"

      - name: Run Semgrep AppSec
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          semgrep ci \
            --sarif \
            --output semgrep_appsec.sarif \
            --no-suppress-errors
      - name: Record scan duration
        if: always()
        run: |
          if [ -n "${START_TIME:-}" ]; then
            END_TIME=$(date +%s)
            DURATION=$((END_TIME - START_TIME))
            echo "Semgrep AppSec scan elapsed time: $DURATION seconds" \
              | tee duration.txt
          fi
      - name: Show SARIF summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("semgrep_appsec.sarif")
          if not path.exists():
              print("SARIF file was not generated. Check the scan log.")
          else:
              data = json.loads(path.read_text(encoding="utf-8"))
              for run in data.get("runs", []):
                  rules = run["tool"]["driver"].get("rules", [])
                  results = run.get("results", [])
                  print(f"Rules listed in SARIF: {len(rules)}")
                  print(f"Findings: {len(results)}")
          PY
      - name: Upload analysis artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-appsec-results-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            semgrep_appsec.sarif
            scanned-commit.txt
            semgrep-version.txt
            duration.txt
          if-no-files-found: error