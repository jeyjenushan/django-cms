name: CodeQL Analysis

on:
  push:
    branches:
      - experiment-vulnerable-defect-before-fixed
      - experiment-fixed-defect
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Python Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Record scanned commit
        run: |
          git rev-parse HEAD > scanned-commit.txt
          echo "Scanned commit: $(cat scanned-commit.txt)"

      - name: Record start time
        run: echo "START_TIME=$(date +%s)" >> "$GITHUB_ENV"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          build-mode: none
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2
        with:
          category: "/language:python"
          output: results
          upload: true

      - name: Record duration
        if: always()
        run: |
          if [ -n "${START_TIME:-}" ]; then
            END_TIME=$(date +%s)
            DURATION=$((END_TIME - START_TIME))
            echo "CodeQL initialization and analysis elapsed time: $DURATION seconds" \
              | tee duration.txt
          fi

      - name: Upload analysis artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-results-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/
            scanned-commit.txt
            duration.txt
          if-no-files-found: error